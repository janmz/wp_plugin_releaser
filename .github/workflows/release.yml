# Release-Build nur bei Tag-Push (v*). Kein doppelter Lauf mit Branch-CI.
# pipeline.yml (Tests, Build) läuft nur mit Leserechten; allein der Job
# "release" erhält contents: write, um das GitHub Release anzulegen.
name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline.yml
    secrets: inherit

  release:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        draft: false
        prerelease: ${{ contains(github.ref, '-') }}
        generate_release_notes: true
        files: artifacts/*/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
